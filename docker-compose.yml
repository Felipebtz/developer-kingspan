name: kingspan-isoeste

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kingspan_procurement}
      POSTGRES_USER: ${DB_USER:-kingspan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kingspan_demo}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - kingspan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - kingspan_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-kingspan_procurement}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-kingspan}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-kingspan_demo}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      APP_CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3000}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-KingspanDemo@2026}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
      SERVER_PORT: 8085
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8085}:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8085/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - kingspan_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8085}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - kingspan_internal

volumes:
  kingspan_postgres_data:

networks:
  kingspan_internal:
    driver: bridge
