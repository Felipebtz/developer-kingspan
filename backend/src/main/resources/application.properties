# Aplicação
spring.application.name=kingspan
server.port=${SERVER_PORT:8085}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:55432}/${DB_NAME:kingspan_procurement}
spring.datasource.username=${DB_USER:kingspan}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Docker Compose
spring.docker.compose.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info
app.admin-bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}