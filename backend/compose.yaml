
services:
  postgres:
    image: postgres:16-alpine
    container_name: kingspan-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kingspan_procurement}
      POSTGRES_USER: ${DB_USER:-kingspan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
    ports:
        - "127.0.0.1:55432:5432"
    volumes:
      - kingspan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kingspan_postgres_data:
